<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b211a"><meta name="description" content="Un toque, una flor. Un ramo amarillo para ti.">
<title>Para MICH 💛</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌼%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b211a;color:#fff1c8;font-family:Arial,sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#344827 0,#152e22 42%,#081b16 85%);overflow:hidden}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ffe189;outline-offset:5px}
[hidden]{display:none!important}
#gift{height:100svh;height:100dvh;min-height:360px;position:relative;isolation:isolate}
h1{position:absolute;top:max(25px,env(safe-area-inset-top));left:20px;right:20px;text-align:center;z-index:3;font:italic normal clamp(32px,5vw,49px)/1.15 Georgia,serif;margin:0;pointer-events:none;overflow-wrap:anywhere;text-shadow:0 0 35px #ffdf7355}
#stage{position:absolute;inset:0;width:100%;height:100%;padding:76px 10px 48px;border:0;background:none;color:inherit;display:flex;align-items:center;justify-content:center;user-select:none;overflow:hidden}
.bouquet{height:100%;max-height:760px;width:100%;max-width:720px;overflow:visible;pointer-events:none;filter:drop-shadow(0 12px 20px #0004)}
.orbit{fill:none;stroke:#e1d6a21a;stroke-width:1}
.flower{opacity:0;transform:translateY(65px) scale(.08);transform-origin:300px 555px}
.flower.visible{opacity:1;transform:translateY(0) scale(1);animation:grow .95s cubic-bezier(.18,.8,.2,1.18) both}
.head{transform-origin:0 0}.visible .head{animation:unfold 1.1s cubic-bezier(.2,.75,.3,1.25) both}
.petal-wheel{transform-origin:0 0}
.stem{fill:none;stroke:url(#stem);stroke-width:4;stroke-linecap:round}
.foliage{fill:url(#leaf)}.petals{fill:url(#petal);stroke:#fbe4a038;stroke-width:.6}
#back-leaves,.wrapping{opacity:0;transition:opacity 1.2s}
.complete #back-leaves,.complete .wrapping{opacity:1}
.arrangement{transform-origin:300px 440px}
.complete .arrangement{animation:dance 5s ease-in-out infinite}
.complete .petal-wheel{animation:spin 25s linear infinite}
.complete .flower:nth-child(even) .petal-wheel{animation-direction:reverse}
#hint{position:absolute;bottom:max(58px,calc(env(safe-area-inset-bottom) + 40px));left:0;right:0;text-align:center;pointer-events:none;color:#dfd9ad;font-size:12px;letter-spacing:2px;transition:opacity .5s}
.started #hint{opacity:0}
.seed{position:absolute;left:50%;top:49%;width:74px;height:74px;margin:-37px;border:1px solid #ffe28b77;border-radius:50%;color:#ffdc70;display:grid;place-items:center;font:35px Georgia;box-shadow:0 0 70px #ffdd6820;animation:pulse 2s ease-in-out infinite;pointer-events:none;transition:opacity .3s}
.seed:before,.seed:after{content:"";position:absolute;inset:-15px;border:1px solid #ffdc7022;border-radius:50%;animation:ripple 2s infinite}
.seed:after{animation-delay:1s}.started .seed{opacity:0}
#dots{position:absolute;bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));display:flex;gap:8px;left:50%;transform:translateX(-50%);pointer-events:none}
#dots i{width:5px;height:5px;border-radius:50%;background:#e2d89c30;transition:background .4s,box-shadow .4s}
#dots i.on{background:#ffda72;box-shadow:0 0 10px #ffda7266}.complete #dots{opacity:0;transition:opacity 1.5s}
#heart{position:absolute;bottom:25px;left:0;right:0;text-align:center;font:32px Georgia;color:#f3cd66;opacity:0;pointer-events:none;transition:opacity 1s}
.complete #heart{opacity:1;animation:pulse 2s ease-in-out infinite}
.spark{position:fixed;pointer-events:none;width:3px;height:3px;border-radius:50%;background:#f8db7c;box-shadow:0 0 8px #ffe29888;animation:float var(--duration) ease-in-out infinite;animation-delay:var(--wait)}
.burst{position:fixed;z-index:4;pointer-events:none;color:#f5cb64;font:21px Georgia;animation:burst 1.8s ease-out forwards}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#pause{position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:5;border:1px solid #e4dca52a;border-radius:50%;width:40px;height:40px;background:#142b2290;color:#dfd7ae;font-size:13px;opacity:.7}
.paused *{animation-play-state:paused!important}
.maker-mode{overflow:auto}.maker{margin:40px auto;width:min(90%,460px);padding:25px;background:#142f25;border:1px solid #d6e3ac40;border-radius:20px}
.maker h2{font:normal 30px Georgia;margin:0 0 20px}.maker label{display:block;font-size:13px;margin:18px 0 8px}.maker input{width:100%;padding:13px;border:1px solid #a4b39866;background:#0d211a;border-radius:8px;color:#fff1c8;font-size:16px}
.maker button{border:0;background:#f6cf68;color:#193024;border-radius:30px;padding:14px 20px;margin-top:20px}.maker a{color:#f6cf68;display:block;margin:20px 0}.maker p{font-size:13px;color:#c0c9ac;line-height:1.6}
@keyframes grow{0%{opacity:0;transform:translateY(70px) scale(.08)}65%{opacity:1;transform:translateY(-9px) scale(1.035)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes unfold{from{transform:rotate(-45deg) scale(.15)}to{transform:rotate(0) scale(1)}}
@keyframes dance{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-13px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes ripple{from{transform:scale(.8);opacity:.8}to{transform:scale(1.65);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0);opacity:.1}50%{transform:translate(15px,-40px);opacity:.7}}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(.7)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(110deg) scale(1.2)}}
@media(max-height:500px){h1{font-size:27px;top:12px}#stage{padding:42px 10px 30px}#hint{bottom:31px}#dots{bottom:15px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.spark,.burst{display:none}.flower.visible{opacity:1;transform:none}}
</style>
</head>
<body>
<main id="gift">
<h1 id="title">Para MICH</h1>
<button id="stage" aria-label="Toca para añadir una flor al ramo">
<svg class="bouquet" viewBox="0 0 600 630" aria-hidden="true">
<title id="bouquet-title">Ramo de nueve flores amarillas con hojas verdes y un lazo dorado</title>
<defs>
<linearGradient id="petal" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff2ab"/><stop offset=".43" stop-color="#f9d35a"/><stop offset="1" stop-color="#d8971d"/></linearGradient>
<linearGradient id="leaf"><stop stop-color="#234c34"/><stop offset=".55" stop-color="#5f8245"/><stop offset="1" stop-color="#a1a759"/></linearGradient>
<linearGradient id="stem"><stop stop-color="#8b9e54"/><stop offset="1" stop-color="#32543a"/></linearGradient>
<radialGradient id="center"><stop stop-color="#735020"/><stop offset=".7" stop-color="#513818"/><stop offset="1" stop-color="#b27b26"/></radialGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ddcda0" stop-opacity=".19"/><stop offset="1" stop-color="#d9ba72" stop-opacity=".04"/></linearGradient>
</defs>
<circle class="orbit" cx="300" cy="285" r="228"/><circle class="orbit" cx="300" cy="285" r="208" stroke-dasharray="2 10"/>
<g class="arrangement"><g id="back-leaves"></g>
<g id="flowers"></g>
<g class="wrapping"><path d="M179 372 Q218 416 303 452 Q365 422 425 375 L341 574 Q304 595 265 574Z" fill="url(#paper)" stroke="#d9c78b45" stroke-width="1"/>
<path d="M179 372 L322 506 L265 574 M425 375 L278 507 L341 574" fill="none" stroke="#ebd9a72b"/>
<g fill="none" stroke="#d7b96e" stroke-width="3" stroke-linecap="round">
<path d="M282 490 Q243 456 241 479 Q245 503 303 494 Q351 459 363 479 Q359 507 303 494"/>
<path d="M304 495 Q283 531 269 544 M305 495 Q325 527 344 537"/>
</g>
<ellipse cx="303" cy="494" rx="9" ry="6" fill="#e5c97e"/>
</g></g></svg>
<span class="seed" aria-hidden="true">✧</span>
</button>
<p id="hint">Toca la pantalla ✨</p>
<div id="dots" aria-hidden="true"></div><div id="heart" aria-hidden="true">♡</div>
<p id="status" class="sr" role="status" aria-live="polite">Toca para añadir la primera flor.</p>
<button id="pause" aria-label="Pausar animación" aria-pressed="false" hidden>Ⅱ</button>
</main>
<section class="maker" id="maker" hidden aria-labelledby="maker-title">
<h2 id="maker-title">Crear un ramo</h2>
<form id="maker-form"><label for="recipient">¿Para quién?</label><input id="recipient" maxlength="40" required placeholder="Su nombre" autocomplete="off"><button type="submit">Crear enlace</button></form>
<div id="result" hidden><label for="gift-link">Enlace para compartir</label><input id="gift-link" readonly><button id="copy-link" type="button">Copiar enlace</button><a id="preview-link" target="_blank" rel="noopener">Ver el ramo</a><p id="copy-status" role="status"></p></div>
</section>
<noscript>Activa JavaScript para hacer florecer tu ramo. 💛</noscript>
<script>
'use strict';
const ns='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);parent.appendChild(node);return node;}
const leaves=document.getElementById('back-leaves');
for(let i=0;i<12;i++){
const side=i%2?1:-1, x=300+side*(72+(i%4)*27),y=245+i*21;
el('path',{d:'M300 545 Q'+x+' '+(y+80)+' '+x+' '+y, class:'stem','stroke-width':2},leaves);
el('path',{d:'M'+x+' '+(y+45)+' Q'+(x-side*55)+' '+(y+8)+' '+(x+side*15)+' '+(y-30)+' Q'+(x+side*35)+' '+(y+15)+' '+x+' '+(y+45),class:'foliage',opacity:.55+(i%3)*.12},leaves);
}
const positions=[[208,171,.81,-12],[328,137,.84,8],[418,216,.82,20],[150,276,.77,-22],[277,253,1.02,-7],[373,320,.96,10],[215,366,.82,-15],[452,365,.66,16],[320,403,.72,3]];
positions.forEach(([x,y,s,angle],i)=>{
const flower=el('g',{class:'flower',style:'--speed:'+(3.3+i*.23)+'s;--lag:-'+i*.7+'s;--delay:'+i*.085+'s'},document.getElementById('flowers'));
el('path',{d:'M'+(289+i*3)+' 560 Q'+(x+28)+' '+(y+140)+' '+x+' '+y,class:'stem'},flower);
el('path',{d:'M'+(x+15)+' '+(y+105)+' q-63 -6 -67 -56 q57 0 67 56 M'+(x+18)+' '+(y+142)+' q63 -8 63 -63 q-49 8 -63 63',class:'foliage'},flower);
const position=el('g',{transform:'translate('+x+' '+y+') rotate('+angle+') scale('+s+')'},flower);
const head=el('g',{class:'head'},position);
const petals=el('g',{class:'petal-wheel'},head);
for(let layer=0;layer<2;layer++)for(let p=0;p<13;p++){
el('ellipse',{cx:0,cy:layer?-34:-38,rx:layer?11:13,ry:layer?27:32,transform:'rotate('+(p*360/13+layer*14)+')',class:'petals',opacity:layer?1:.82},petals);
}
el('circle',{r:23,fill:'url(#center)'},head);
for(let d=0;d<65;d++){const a=d*2.399,r=2.3*Math.sqrt(d);el('circle',{cx:Math.cos(a)*r,cy:Math.sin(a)*r,r:1.1,fill:d%3?'#d5a946':'#f0c763',opacity:.72},head);}
});

const params=new URLSearchParams(location.hash.slice(1));
const to=(params.get('para')||'MICH').slice(0,80);
document.getElementById('title').textContent='Para '+to;document.title='Para '+to+' 💛';
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
const flowers=Array.from(document.querySelectorAll('.flower'));
const order=[4,0,1,2,3,5,6,7,8],stage=document.getElementById('stage'),status=document.getElementById('status');
let count=0;
for(let i=0;i<flowers.length;i++)document.getElementById('dots').appendChild(document.createElement('i'));
if(!reduce.matches)for(let i=0;i<16;i++){const dot=document.createElement('span');dot.className='spark';dot.setAttribute('aria-hidden','true');dot.style.cssText='left:'+(8+(i*47)%85)+'%;top:'+(14+(i*29)%74)+'%;--duration:'+(4+i%5)+'s;--wait:-'+i*.6+'s';document.body.appendChild(dot);}
function burst(x,y,total){
if(reduce.matches||document.body.classList.contains('paused'))return;
const budget=Math.min(total,90-document.querySelectorAll('.burst').length);
for(let i=0;i<budget;i++){const p=document.createElement('span');p.className='burst';p.textContent=i%3?'✦':'♡';p.setAttribute('aria-hidden','true');p.style.cssText='left:'+x+'px;top:'+y+'px;--dx:'+((Math.random()-.5)*330)+'px;--dy:'+(-60-Math.random()*230)+'px';document.body.appendChild(p);setTimeout(()=>p.remove(),1850);}
}
stage.addEventListener('click',event=>{
document.body.classList.add('started');
const rect=stage.getBoundingClientRect(),x=event.detail?event.clientX:rect.width/2,y=event.detail?event.clientY:rect.height/2;
if(count<flowers.length){
flowers[order[count]].classList.add('visible');document.querySelectorAll('#dots i')[count].classList.add('on');count++;
status.textContent=count+' de '+flowers.length+' flores.';
burst(x,y,10);
if(count===flowers.length){document.body.classList.add('complete');stage.setAttribute('aria-label','Ramo completo. Toca para crear destellos');status.textContent='Tu ramo está completo.';document.getElementById('pause').hidden=false;burst(rect.width/2,rect.height*.48,35);}
}else{burst(x,y,20);}
});
document.getElementById('pause').addEventListener('click',function(){
const paused=document.body.classList.toggle('paused');this.setAttribute('aria-pressed',String(paused));this.setAttribute('aria-label',paused?'Activar animación':'Pausar animación');this.textContent=paused?'▷':'Ⅱ';
});
if(new URLSearchParams(location.search).has('crear')){document.getElementById('gift').hidden=true;document.getElementById('maker').hidden=false;document.body.classList.add('maker-mode');}
document.getElementById('maker-form').addEventListener('submit',event=>{
event.preventDefault();const recipient=document.getElementById('recipient').value.trim();if(!recipient)return;
const gift=new URL(location.href);gift.search='';gift.hash=new URLSearchParams({para:recipient}).toString();
document.getElementById('gift-link').value=gift.href;document.getElementById('preview-link').href=gift.href;document.getElementById('result').hidden=false;document.getElementById('copy-status').textContent='Este enlace solo muestra el regalo.';
});
document.getElementById('copy-link').addEventListener('click',async()=>{
const input=document.getElementById('gift-link'),status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(input.value);status.textContent='Enlace copiado 💛';}catch(error){input.focus();input.select();status.textContent='Mantén presionado el enlace o usa Ctrl+C para copiarlo.';}
});
</script>
</body></html>
